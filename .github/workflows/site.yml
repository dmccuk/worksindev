name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Fetch the in-browser VM image
        # The Linux image is built and released by the learndevops repo.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R dmccuk/learndevops --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("browser-vm-"))][0].tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No browser-vm release found; the terminal will show a load error."
            exit 0
          fi
          echo "Using $TAG"
          gh release download "$TAG" -R dmccuk/learndevops --pattern browser-vm.tar --dir "$RUNNER_TEMP"
          mkdir -p public/vm
          tar -xf "$RUNNER_TEMP/browser-vm.tar" -C public/vm
          du -sh public/vm
      - run: npm run build
      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
